<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E9" />
    <script>
      // Tema: React yüklenmeden uygulanır (beyaz/koyu yanıp sönme olmasın). Varsayılan açık. Bkz. src/lib/theme.tsx
      (function () {
        var t = 'light'
        try { if (localStorage.getItem('theme') === 'dark') t = 'dark' } catch (e) {}
        document.documentElement.setAttribute('data-theme', t)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#15110E' : '#F6F1E9')
      })()
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>BehTech Randevu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
