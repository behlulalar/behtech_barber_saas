# /etc/nginx/conf.d/berber-limits.conf — YALNIZCA berber sitesi için (diğer sistemlerin bölgelerine dokunmaz).
limit_req_zone $binary_remote_addr zone=berber_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=berber_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=berber_conn:10m;
